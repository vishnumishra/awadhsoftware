# Production configuration for awadhsoftware.com
# The repo root holds the design-synced source; `npm run build` emits dist/.

[build]
  command  = "npm run build"
  publish  = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# The chatbot widget calls /api/chat; keep the Netlify path an implementation detail.
[[redirects]]
  from = "/api/chat"
  to   = "/.netlify/functions/chat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Fingerprinted bundles are immutable.
[[headers]]
  for = "/assets/app.*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/styles.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images keep stable names, so revalidate daily rather than caching forever.
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Prerendered pages: always revalidate so content edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
